<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><main class="auth-card"><h2>Sản phẩm</h2><form action="/products/save" method="post" th:object="${form}"><input th:field="*{name}" placeholder="Tên" required><input type="number" step="0.01" th:field="*{price}" placeholder="Giá" required><textarea th:field="*{description}" placeholder="Mô tả"></textarea><select th:field="*{categoryId}" required><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><button class="btn">Lưu</button></form></main></body></html>
