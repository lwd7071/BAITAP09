<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="auth-card"><h2>Đăng ký</h2><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" th:object="${form}" method="post"><input th:field="*{username}" placeholder="Username" required><input type="email" th:field="*{email}" placeholder="Email" required><input th:field="*{fullName}" placeholder="Họ tên" required><input type="password" th:field="*{password}" placeholder="Mật khẩu" required><input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu" required><button class="btn">Đăng ký</button></form></main></body></html>
