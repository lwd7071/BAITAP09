<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="auth-card"><h2>Đăng nhập</h2><div class="error" th:if="${param.error}">Username/email hoặc password không đúng</div><div class="success" th:if="${param.verified}">Xác nhận thành công</div><form th:action="@{/login}" method="post"><label>Username hoặc Email</label><input name="username" required><label>Password</label><input type="password" name="password" required><button class="btn">Đăng nhập</button></form><a href="/register">Đăng ký</a> · <a href="/forgot-password">Quên mật khẩu</a></main></body></html>
