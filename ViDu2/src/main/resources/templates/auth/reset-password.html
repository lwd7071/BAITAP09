<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><main class="auth-card"><h2>Đặt lại mật khẩu</h2><div class="error" th:if="${error}" th:text="${error}"></div><form action="/reset-password" method="post" th:object="${form}"><input type="hidden" name="email" th:value="${email}"><input name="code" placeholder="OTP" required><input type="password" th:field="*{password}" placeholder="Mật khẩu mới" required><input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại" required><button class="btn">Đổi mật khẩu</button></form></main></body></html>
