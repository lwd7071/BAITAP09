<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><header th:fragment="header" class="topbar"><a href="/">UTEShop</a><nav sec:authorize="isAuthenticated()"><a href="/dashboard">Dashboard</a><a href="/products">Products</a><a sec:authorize="hasRole('ADMIN')" href="/users">Users</a><a sec:authorize="hasRole('ADMIN')" href="/categories">Categories</a></nav><section class="account" sec:authorize="isAuthenticated()"><img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}" width="40" height="40" alt="Avatar"><span th:text="${#authentication.principal.fullName}">User</span><span th:text="'(' + ${#authentication.principal.username} + ')'">(user)</span><span th:text="${#authentication.principal.email}">email</span><span th:text="${#authentication.principal.role}">ROLE_USER</span><form th:action="@{/logout}" method="post"><button>Đăng xuất</button></form></section><a sec:authorize="!isAuthenticated()" href="/login">Đăng nhập</a></header></body></html>
