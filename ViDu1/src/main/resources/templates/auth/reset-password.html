<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đặt lại mật khẩu')}"></head><body><main class="auth-card"><h1>Đặt lại mật khẩu</h1><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/reset-password}" th:object="${form}" method="post"><input type="hidden" name="email" th:value="${email}"><label>OTP</label><input name="code" required><label>Mật khẩu mới</label><input type="password" th:field="*{password}" required><label>Nhập lại</label><input type="password" th:field="*{confirmPassword}" required><button class="btn">Đổi mật khẩu</button></form></main></body></html>
