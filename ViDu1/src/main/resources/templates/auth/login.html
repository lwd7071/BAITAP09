<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đăng nhập')}"></head><body><main class="auth-card"><h1>Đăng nhập</h1><div class="error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div><div class="success" th:if="${param.verified}">Xác nhận tài khoản thành công.</div><div class="success" th:if="${param.reset}">Đổi mật khẩu thành công.</div><div class="success" th:if="${param.logout}">Bạn đã đăng xuất.</div><form th:action="@{/login}" method="post"><label>Email</label><input type="email" name="email" required><label>Mật khẩu</label><input type="password" name="password" required><button class="btn" type="submit">Đăng nhập</button></form><p><a th:href="@{/register}">Đăng ký</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p></main></body></html>
