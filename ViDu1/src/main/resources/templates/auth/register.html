<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Đăng ký')}"></head><body><main class="auth-card"><h1>Đăng ký</h1><div class="error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" th:object="${form}" method="post"><label>Email</label><input type="email" th:field="*{email}" required><label>Họ tên</label><input th:field="*{fullName}" required><label>Mật khẩu</label><input type="password" th:field="*{password}" required><label>Nhập lại mật khẩu</label><input type="password" th:field="*{confirmPassword}" required><button class="btn">Đăng ký</button></form></main></body></html>
