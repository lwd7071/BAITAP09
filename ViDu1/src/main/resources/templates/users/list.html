<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Users')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Quản lý users</h1><form><input name="q" th:value="${q}" placeholder="Tìm email hoặc họ tên"><button class="btn">Tìm</button></form><table><tr><th>Email</th><th>Họ tên</th><th>Role</th><th>Trạng thái</th><th></th></tr><tr th:each="u:${users.content}"><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.role.name}"></td><td th:text="${u.enabled?'Đang bật':'Đã khóa'}"></td><td><form th:action="@{'/users/'+${u.id}+'/toggle'}" method="post"><button class="link">Bật/tắt</button></form></td></tr></table></main></body></html>
