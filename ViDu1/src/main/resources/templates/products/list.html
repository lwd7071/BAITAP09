<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Sản phẩm')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="container"><h1>Sản phẩm</h1><form><input name="q" th:value="${q}" placeholder="Tìm sản phẩm"><button class="btn">Tìm</button><a class="btn" th:href="@{/products/new}">Thêm sản phẩm</a></form><table><tr><th>Tên</th><th>Giá</th><th>Danh mục</th><th></th></tr><tr th:each="p:${products.content}"><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.category.name}"></td><td><form th:action="@{'/products/delete/'+${p.id}}" method="post"><button class="link">Xóa</button></form></td></tr></table></main></body></html>
