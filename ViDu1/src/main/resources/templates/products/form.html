<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Thêm sản phẩm')}"></head><body><header th:replace="~{fragments/header :: header}"></header><main class="auth-card"><h1>Thêm sản phẩm</h1><form th:action="@{/products/save}" th:object="${form}" method="post" enctype="multipart/form-data"><label>Tên</label><input th:field="*{name}" required><label>Giá</label><input type="number" step="0.01" th:field="*{price}" required><label>Mô tả</label><textarea th:field="*{description}"></textarea><label>Danh mục</label><select th:field="*{categoryId}" required><option value="">-- Chọn --</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><label>Ảnh</label><input type="file" name="image" accept="image/*"><button class="btn">Lưu</button></form></main></body></html>
